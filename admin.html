<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>CustomTshirt73 Admin</title>
<style>
  :root{--bg:#f4f3f0;--card:#fff;--ink:#141414;--muted:#6b6b6b;--line:#e2e0dc;--accent:#c8323a;--ok:#2f7d4a;--warn:#b7791f}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  header{background:#141414;color:#fff;padding:14px 16px;display:flex;align-items:center;gap:12px}
  header b{font-size:17px}header span{flex:1}
  header button{background:transparent;color:#fff;border:1px solid #555;border-radius:8px;padding:6px 10px;cursor:pointer}
  main{max-width:860px;margin:0 auto;padding:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
  h2{margin:0 0 12px;font-size:20px}h3{margin:0 0 6px;font-size:17px}
  label{display:block;font-weight:600;margin:12px 0 4px}
  input,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff;color:var(--ink)}
  textarea{min-height:110px;resize:vertical}
  .btn{display:inline-block;border:0;border-radius:10px;padding:11px 16px;font:600 15px system-ui,sans-serif;cursor:pointer;background:#e9e7e3;color:var(--ink);text-decoration:none}
  .btn.accent{background:var(--accent);color:#fff}.btn.block{width:100%;margin-top:14px}.btn:disabled{opacity:.6;cursor:wait}
  .muted{color:var(--muted);font-size:13px}.err{color:var(--accent);font-weight:600}
  .req{display:block;width:100%;text-align:left;cursor:pointer;font:inherit;color:inherit}
  .req:hover{border-color:#bbb}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .badge{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:#fdeaea;color:var(--accent)}
  .badge.quoted{background:#e7f4ec;color:var(--ok)}
  .photos{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
  .photos a img{width:110px;height:110px;object-fit:cover;border-radius:10px;border:1px solid var(--line);display:block}
  .result{border-left:4px solid var(--ok)}.result.warn{border-left-color:var(--warn)}
  .link-row{display:flex;gap:6px;margin-top:8px}.link-row input{flex:1;min-width:0;font-size:13px}
  .hidden{display:none}
</style>
</head><body>
<header><b>CustomTshirt73 Admin</b><span></span><button id="logout" class="hidden">Log out</button></header>
<main>
  <section id="login" class="card">
    <h2>Log in</h2>
    <form id="loginForm"><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" required>
    <button class="btn accent block" type="submit" id="loginBtn">Log in</button><p class="err" id="loginErr"></p></form>
  </section>

  <section id="list" class="hidden">
    <div class="row" style="margin-bottom:12px"><h2 style="flex:1;margin:0">Design requests</h2><button class="btn" id="refresh">Refresh</button></div>
    <div id="reqs"></div>
  </section>

  <section id="detail" class="hidden">
    <button class="btn" id="back">&larr; All requests</button>
    <div class="card" style="margin-top:12px" id="info"></div>
    <div class="card" id="quoteCard">
      <h3>Send a price</h3>
      <p class="muted">This makes a Square payment link for the price and sends it to the customer.</p>
      <form id="quoteForm">
        <label for="price">Price ($)</label><input id="price" type="number" min="1" max="10000" step="0.01" required inputmode="decimal">
        <label for="msg">Message to the customer</label><textarea id="msg" maxlength="1500"></textarea>
        <button class="btn accent block" type="submit" id="quoteBtn">Create payment link and send</button>
        <p class="err" id="quoteErr"></p>
      </form>
    </div>
    <div class="card result hidden" id="result"></div>
  </section>
</main>
<script src="admin.js"></script>
</body></html>
